[env:ax-device]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D AX_DEVICE_ID=\"AX-001\"
  -D AX_API_URL=\"http://192.168.1.10:8000/api/v1/events/button-pressed\"

# Credenciais Wi-Fi devem ser fornecidas fora do Git:
# pio run -e ax-device --project-option="build_flags=-D WIFI_SSID=... -D WIFI_PASSWORD=..."

