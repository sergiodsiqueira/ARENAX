openapi: 3.1.0
info:
  title: ARENAX Core API
  version: 0.1.0
security:
  - cookieAuth: []
paths:
  /api/v1/license-status:
    get:
      security: []
      operationId: getLicenseStatus
      summary: Informa se a instalação está autorizada a operar.
      responses:
        '200':
          description: Decisão atual, baseada na consulta remota ou no estado persistido.
          content: {application/json: {schema: {$ref: '#/components/schemas/LicenseStatus'}}}
  /api/v1/health-center:
    get:
      operationId: getHealthCenter
      summary: Consolidate the current health of ARENAX infrastructure and Cameras.
      responses:
        '200': {description: Current infrastructure health projection, content: {application/json: {schema: {$ref: '#/components/schemas/HealthCenter'}}}}
        '401': {description: Access absent, expired or revoked}
  /api/v1/operational-events:
    get:
      operationId: streamOperationalEvents
      summary: Stream signals that operational projections should be refreshed.
      responses:
        '200':
          description: Server-Sent Events stream. Each `operational-update` event contains an OperationalEvent JSON payload.
          content:
            text/event-stream:
              schema: {type: string}
        '401': {description: Access absent, expired or revoked}
  /api/v1/auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        '200':
          description: Authenticated; an HttpOnly access cookie is issued.
          content: {application/json: {schema: {$ref: '#/components/schemas/LoginResult'}}}
        '401': {description: Invalid credentials}
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200': {description: Current User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {description: Access absent, expired or revoked}
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses: {'204': {description: Access revoked and cookie removed}}
  /api/v1/users:
    get:
      operationId: listUsers
      responses:
        '200': {description: Users visible to the administrator, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ManagedUser'}}}}}
        '403': {description: Administrative permission required}
    post:
      operationId: createUser
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUserInput'}}}}
      responses:
        '201': {description: User created, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedUser'}}}}
        '403': {description: Role cannot be managed by the current User}
  /api/v1/users/{userId}:
    put:
      operationId: updateUser
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateUserInput'}}}}
      responses:
        '200': {description: User updated, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedUser'}}}}
        '403': {description: User cannot be managed by the current User}
        '404': {description: User not found}
        '422': {description: At least one active Owner must remain}
  /api/v1/users/{userId}/reset-password:
    post:
      operationId: resetUserPassword
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [password], properties: {password: {type: string, format: password, minLength: 12}}}}}}
      responses:
        '204': {description: Password updated and existing Accesses revoked}
        '403': {description: User cannot be managed by the current User}
  /api/v1/settings:
    get:
      operationId: getOperationalSettings
      responses:
        '200': {description: Global operational settings, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalSettings'}}}}
        '403': {description: Administrative permission required}
    put:
      operationId: updateOperationalSettings
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OperationalSettingsInput'}}}
      responses:
        '200': {description: Operational settings updated, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalSettings'}}}}
        '403': {description: Administrative permission required}
        '422': {description: Invalid duration values}
  /api/v1/storage/select-folder:
    post:
      operationId: selectReplayStorageFolder
      summary: Ask the interactive Windows agent to open the native folder picker.
      responses:
        '200': {description: Selected folder or a cancelled selection, content: {application/json: {schema: {$ref: '#/components/schemas/StorageFolderSelection'}}}}
        '403': {description: Administrative permission required}
        '503': {description: Local Agent is not installed, configured or available}
  /api/v1/network-interfaces:
    get:
      operationId: listHostNetworkInterfaces
      summary: List active host IPv4 interfaces detected by the ARENAX Local Agent.
      responses:
        '200': {description: Active network interfaces, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NetworkInterface'}}}}}
        '403': {description: Administrative permission required}
        '503': {description: Local Agent is not installed, configured or available}
  /api/v1/postal-codes/{postalCode}:
    get:
      operationId: lookupPostalCode
      summary: Look up a Brazilian postal code through the configured OpenCEP gateway.
      parameters: [{name: postalCode, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Address suggestion, content: {application/json: {schema: {$ref: '#/components/schemas/PostalCode'}}}}
        '401': {description: Active authenticated User required}
        '422': {description: Postal code must contain 8 digits}
        '503': {description: OpenCEP is temporarily unavailable}
  /api/v1/storage/apply:
    post:
      operationId: applyReplayStorageFolder
      summary: Start the validated local media migration and Docker remount.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [path], properties: {path: {type: string, minLength: 3}}}}}
      responses:
        '202': {description: Migration accepted, content: {application/json: {schema: {$ref: '#/components/schemas/StorageChange'}}}}
        '403': {description: Administrative permission required}
        '503': {description: Local Agent is not installed, configured or available}
  /api/v1/clients:
    get:
      operationId: listClients
      responses:
        '200':
          description: Clients ordered by name.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Client'}}}}
    post:
      operationId: createClient
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateClientInput'}}}}
      responses: {'201': {$ref: '#/components/responses/Created'}}
  /api/v1/clients/{clientId}:
    put:
      operationId: updateClient
      parameters: [{name: clientId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientInput'}}}}
      responses:
        '200': {description: Client updated, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}
        '404': {description: Client not found}
    delete:
      operationId: deleteClient
      parameters: [{name: clientId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Client deleted}
        '404': {description: Client not found}
        '409': {description: Client is responsible for one or more Sessions}
  /api/v1/people:
    get:
      deprecated: true
      operationId: listPeopleCompatibility
      responses:
        '200': {description: Deprecated alias for listClients, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/NamedResource'}}}}}
    post:
      deprecated: true
      operationId: createPersonCompatibility
      requestBody: {$ref: '#/components/requestBodies/NamedResource'}
      responses: {'201': {$ref: '#/components/responses/Created'}}
  /api/v1/spaces:
    get:
      operationId: listSpaces
      responses:
        '200':
          description: Spaces ordered by name. Occupancy is derived from Sessions and is not returned here.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Space'}}}}
    post:
      operationId: createSpace
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateSpaceInput'}}}}
      responses: {'201': {$ref: '#/components/responses/Created'}}
  /api/v1/spaces/{spaceId}:
    put:
      operationId: updateSpace
      parameters: [{name: spaceId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SpaceInput'}}}}
      responses:
        '200': {description: Space updated, content: {application/json: {schema: {$ref: '#/components/schemas/Space'}}}}
        '403': {description: Administrative permission required}
        '404': {description: Space not found}
    delete:
      operationId: deleteSpace
      parameters: [{name: spaceId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Space deleted}
        '403': {description: Administrative permission required}
        '404': {description: Space not found}
        '409': {description: Space has Sessions or Equipment}
  /api/v1/equipments:
    get:
      operationId: listEquipments
      parameters:
        - {name: space_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Equipment ordered by kind and external identifier.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Equipment'}}}}
    post:
      operationId: createEquipment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EquipmentInput'}
      responses: {'201': {$ref: '#/components/responses/Created'}}
  /api/v1/equipments/{equipmentId}:
    put:
      operationId: updateEquipment
      parameters: [{name: equipmentId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EquipmentInput'}
      responses:
        '200': {description: Equipment updated, content: {application/json: {schema: {$ref: '#/components/schemas/Equipment'}}}}
        '403': {description: Administrative permission required}
        '404': {description: Equipment or Space not found}
    delete:
      operationId: deleteEquipment
      parameters: [{name: equipmentId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Equipment deleted}
        '403': {description: Administrative permission required}
        '404': {description: Equipment not found}
  /api/v1/cameras/{cameraId}/health:
    get:
      operationId: getCameraHealth
      parameters: [{name: cameraId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Last Capture Service health report, content: {application/json: {schema: {$ref: '#/components/schemas/CameraHealth'}}}}
        '403': {description: Administrative permission required}
  /api/v1/cameras/{cameraId}/live:
    post:
      operationId: openCameraLiveStream
      summary: Register the Camera RTSP source in the internal gateway and return its WebRTC URL.
      parameters: [{name: cameraId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Browser-safe live stream URL, content: {application/json: {schema: {$ref: '#/components/schemas/CameraLive'}}}}
        '403': {description: Administrative permission required}
        '404': {description: Camera not found}
        '503': {description: Live video gateway unavailable}
  /api/v1/moments/{momentId}/replay:
    get:
      operationId: getMomentReplay
      parameters: [{name: momentId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Generated Replay MP4, content: {video/mp4: {schema: {type: string, format: binary}}}}
        '404': {description: Replay not generated or file unavailable}
  /api/v1/moments/{momentId}/share:
    post:
      operationId: registerReplayShare
      summary: Audit an authenticated local Replay sharing intention.
      parameters: [{name: momentId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Sharing intention registered in the Session Timeline}
        '401': {description: Access absent, expired or revoked}
        '404': {description: Replay unavailable}
  /api/v1/sessions:
    get:
      operationId: getAgenda
      summary: List Sessions whose scheduled period intersects the requested window.
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: end, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: space_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Sessions ordered by scheduled start.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Session'}}
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionInput'}
      responses:
        '201': {$ref: '#/components/responses/Session'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/sessions/in-progress:
    get:
      operationId: listInProgressSessions
      summary: List every Session currently in progress, independent of its scheduled date.
      responses:
        '200':
          description: In-progress Sessions ordered by actual start.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Session'}}
  /api/v1/sessions/{sessionId}/actions/{action}:
    post:
      operationId: transitionSession
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [confirm, start, finish, cancel, no_show]}}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '204': {description: Untouched agenda deleted after cancellation}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/sessions/{sessionId}:
    get:
      operationId: getSessionDossier
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Session dossier including Moments and Timeline, content: {application/json: {schema: {$ref: '#/components/schemas/SessionDossier'}}}}
        '404': {description: Session not found}
  /api/v1/sessions/{sessionId}/extend:
    post:
      operationId: extendSession
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_end]
              properties: {scheduled_end: {type: string, format: date-time}}
      responses: {'200': {$ref: '#/components/responses/Session'}, '409': {$ref: '#/components/responses/Conflict'}}
  /api/v1/sessions/{sessionId}/payments:
    post:
      operationId: registerPayment
      summary: Register an immutable manual Payment for a Session.
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RegisterPaymentInput'}}}
      responses:
        '201': {description: Payment registered, content: {application/json: {schema: {$ref: '#/components/schemas/Payment'}}}}
        '404': {description: Session not found}
        '422': {description: Invalid amount, method or note}
  /api/v1/sessions/{sessionId}/expected-amount:
    put:
      operationId: changeExpectedAmount
      parameters: [{name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedAmountInput'}}}}
      responses:
        '200': {description: Manual expected amount applied, content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedAmount'}}}}
        '404': {description: Session not found}
  /api/v1/sessions/{sessionId}/expected-amount/recalculate:
    post:
      operationId: recalculateExpectedAmount
      parameters: [{name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Expected amount recalculated from the Session historical Space rates, content: {application/json: {schema: {$ref: '#/components/schemas/ExpectedAmount'}}}}
        '404': {description: Session not found}
  /api/v1/events/button-pressed:
    post:
      security: []
      operationId: registerButtonPress
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ButtonPress'}
      responses:
        '202':
          description: Physical event audited; accepted indicates whether a Moment was requested.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ButtonPressResult'}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: arenax_acesso
  requestBodies:
    NamedResource:
      required: true
      content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}}}}}
  responses:
    Created:
      description: Created
      content: {application/json: {schema: {type: object, properties: {id: {type: string, format: uuid}}}}}
    Session:
      description: Session state
      content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}
    Conflict:
      description: Domain invariant rejected the intention
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    LicenseStatus:
      type: object
      required: [allowed, reason, grace_until, support_company, support_whatsapp, support_email]
      properties:
        allowed: {type: boolean}
        reason:
          type: string
          enum: [license_active, license_blocked, license_expired, initial_offline_grace, license_unverified]
        customer_name: {type: string}
        valid_until: {type: [string, 'null'], format: date}
        grace_until: {type: string, format: date-time}
        next_check_at: {type: [string, 'null'], format: date-time}
        support_company: {type: string}
        support_whatsapp: {type: string}
        support_email: {type: string, format: email}
    OperationalEvent:
      type: object
      required: [resource, occurred_at]
      properties:
        resource: {type: string, enum: [sessions, spaces, clients]}
        occurred_at: {type: string, format: date-time}
        entity_id: {type: [string, 'null'], format: uuid}
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
        remember: {type: boolean, default: false}
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [proprietario, administrador, operador]}
    LoginResult:
      type: object
      required: [user]
      properties: {user: {$ref: '#/components/schemas/User'}}
    ManagedUser:
      allOf:
        - {$ref: '#/components/schemas/User'}
        - type: object
          required: [status, created_at, updated_at]
          properties:
            status: {type: string, enum: [ativo, bloqueado, desativado]}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
            last_access_at: {type: [string, 'null'], format: date-time}
    CreateUserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name: {type: string, maxLength: 160}
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, format: password, minLength: 12}
        role: {type: string, enum: [proprietario, administrador, operador]}
    UpdateUserInput:
      type: object
      required: [role, status]
      properties:
        role: {type: string, enum: [proprietario, administrador, operador]}
        status: {type: string, enum: [ativo, bloqueado, desativado]}
    NamedResource:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Client:
      allOf:
        - {$ref: '#/components/schemas/NamedResource'}
        - type: object
          required: [client_type, document, postal_code, address, city, state, notes, phone, email, whatsapp, administrative_status]
          properties:
            client_type: {type: string, enum: [F, J]}
            document: {type: string, pattern: '^$|^(?:[0-9]{11}|[A-Z0-9]{12}[0-9]{2})$'}
            postal_code: {type: string, pattern: '^$|^[0-9]{8}$'}
            address: {type: string, maxLength: 250}
            city: {type: string, maxLength: 120}
            state: {type: string, pattern: '^$|^[A-Z]{2}$'}
            notes: {type: string}
            phone: {type: string, pattern: '^$|^[0-9]{10,11}$'}
            email: {type: string}
            whatsapp: {type: boolean}
            administrative_status: {type: string, enum: [active, inactive]}
    CreateClientInput:
      type: object
      required: [name, client_type, postal_code, address, city, state]
      properties:
        name: {type: string, maxLength: 160}
        client_type: {type: string, enum: [F, J]}
        document: {type: string, pattern: '^$|^(?:[0-9]{11}|[A-Z0-9]{12}[0-9]{2})$', default: ''}
        postal_code: {type: string, pattern: '^$|^[0-9]{8}$'}
        address: {type: string, maxLength: 250}
        city: {type: string, maxLength: 120}
        state: {type: string, pattern: '^$|^[A-Z]{2}$'}
        notes: {type: string}
        phone: {type: string, pattern: '^$|^[0-9]{10,11}$', default: ''}
        email: {type: string, default: ''}
        whatsapp: {type: boolean, default: false}
        administrative_status: {type: string, enum: [active, inactive], default: active}
    ClientInput:
      type: object
      required: [name, client_type, postal_code, address, city, state, administrative_status]
      properties:
        name: {type: string, maxLength: 160}
        client_type: {type: string, enum: [F, J]}
        document: {type: string, pattern: '^$|^(?:[0-9]{11}|[A-Z0-9]{12}[0-9]{2})$', default: ''}
        postal_code: {type: string, pattern: '^$|^[0-9]{8}$'}
        address: {type: string, maxLength: 250}
        city: {type: string, maxLength: 120}
        state: {type: string, pattern: '^$|^[A-Z]{2}$'}
        notes: {type: string}
        phone: {type: string, pattern: '^$|^[0-9]{10,11}$', default: ''}
        email: {type: string, default: ''}
        whatsapp: {type: boolean, default: false}
        administrative_status: {type: string, enum: [active, inactive]}
    Space:
      allOf:
        - {$ref: '#/components/schemas/NamedResource'}
        - type: object
          required: [administrative_status, minute_rate_cents]
          properties:
            administrative_status: {type: string}
            minute_rate_cents: {type: integer, minimum: 0}
    CreateSpaceInput:
      type: object
      required: [name, minute_rate_cents]
      properties:
        name: {type: string, maxLength: 120}
        administrative_status: {type: string, enum: [active, disabled], default: active}
        minute_rate_cents: {type: integer, minimum: 0}
    SpaceInput:
      type: object
      required: [name, administrative_status, minute_rate_cents]
      properties:
        name: {type: string, maxLength: 120}
        administrative_status: {type: string, enum: [active, maintenance, disabled]}
        minute_rate_cents: {type: integer, minimum: 0}
    Equipment:
      allOf:
        - {$ref: '#/components/schemas/EquipmentInput'}
        - type: object
          required: [id]
          properties: {id: {type: string, format: uuid}}
    EquipmentInput:
      type: object
      required: [space_id, kind, external_id]
      properties:
        space_id: {type: string, format: uuid}
        kind: {type: string, enum: [camera, ax_device]}
        external_id: {type: string}
        description: {type: string, maxLength: 160, default: ''}
        configuration: {type: object}
        administrative_status: {type: string, enum: [active, inactive], default: active}
    CameraHealth:
      type: object
      required: [camera_id, status]
      properties:
        camera_id: {type: string, format: uuid}
        status: {type: string, enum: [waiting, starting, capturing, failed, unknown]}
        checked_at: {type: [string, 'null'], format: date-time}
        error: {type: [string, 'null']}
    CameraLive:
      type: object
      required: [url]
      properties: {url: {type: string, format: uri}}
    HealthItem:
      type: object
      required: [name, label, status]
      properties:
        name: {type: string}
        label: {type: string}
        status: {type: string, enum: [healthy, degraded, unavailable, unknown]}
        checked_at: {type: [string, 'null'], format: date-time}
        detail: {type: [string, 'null']}
        response_time_ms: {type: [integer, 'null']}
        total_bytes: {type: [integer, 'null']}
        free_bytes: {type: [integer, 'null']}
        used_percent: {type: [number, 'null']}
    CameraHealthItem:
      type: object
      required: [camera_id, external_id, space_id, space_name, administrative_status, status]
      properties:
        camera_id: {type: string, format: uuid}
        external_id: {type: string}
        space_id: {type: string, format: uuid}
        space_name: {type: string}
        administrative_status: {type: string, enum: [active, inactive]}
        status: {type: string, enum: [healthy, unavailable, unknown, inactive]}
        checked_at: {type: [string, 'null'], format: date-time}
        detail: {type: [string, 'null']}
    HealthCenter:
      type: object
      required: [status, checked_at, ax_device_api_url, services, cameras]
      properties:
        status: {type: string, enum: [healthy, attention, critical]}
        checked_at: {type: string, format: date-time}
        ax_device_api_url:
          type: [string, 'null']
          format: uri
          description: URL configured for AX Devices to publish button press events on the Arena local network.
        services: {type: array, items: {$ref: '#/components/schemas/HealthItem'}}
        cameras: {type: array, items: {$ref: '#/components/schemas/CameraHealthItem'}}
    OperationalSettingsInput:
      type: object
      required: [default_session_duration_minutes, replay_pre_duration_seconds, replay_post_duration_seconds, calculate_actual_time]
      properties:
        default_session_duration_minutes: {type: integer, minimum: 1}
        replay_pre_duration_seconds: {type: integer, minimum: 0}
        replay_post_duration_seconds: {type: integer, minimum: 0}
        calculate_actual_time: {type: boolean, default: true}
        replay_retention_days:
          description: Null disables automatic Replay removal.
          type: [integer, 'null']
          minimum: 1
        company_tax_id: {type: string, pattern: '^$|^[A-Z0-9]{12}[0-9]{2}$'}
        company_legal_name: {type: string, maxLength: 180}
        company_trade_name: {type: string, maxLength: 180}
        company_address: {type: string, maxLength: 250}
        company_postal_code: {type: string, pattern: '^$|^[0-9]{8}$'}
        company_city: {type: string, maxLength: 120}
        company_state: {type: string, pattern: '^$|^[A-Z]{2}$'}
        company_phone: {type: string, pattern: '^$|^[0-9]{10,11}$'}
        ax_device_network_interface_id: {type: string, maxLength: 120}
        ax_device_network_interface_name: {type: string, maxLength: 160}
        ax_device_network_address: {type: string, maxLength: 45}
    NetworkInterface:
      type: object
      required: [id, name, address]
      properties:
        id: {type: string}
        name: {type: string}
        address: {type: string, format: ipv4}
    OperationalSettings:
      allOf:
        - {$ref: '#/components/schemas/OperationalSettingsInput'}
        - type: object
          required: [updated_at, media_storage_path]
          properties:
            updated_at: {type: string, format: date-time}
            media_storage_path: {type: string}
    StorageFolderSelection:
      type: object
      required: [path, cancelled]
      properties:
        path: {type: [string, 'null']}
        cancelled: {type: boolean}
    PostalCode:
      type: object
      required: [postal_code, street, neighborhood, city, state]
      properties:
        postal_code: {type: string, pattern: '^[0-9]{8}$'}
        street: {type: string}
        neighborhood: {type: string}
        city: {type: string}
        state: {type: string}
    StorageChange:
      type: object
      required: [accepted, path]
      properties:
        accepted: {type: boolean}
        path: {type: string}
    SessionInput:
      type: object
      required: [responsible_client_id, space_ids, scheduled_start, scheduled_end]
      properties:
        responsible_client_id: {type: string, format: uuid}
        space_ids: {type: array, minItems: 1, items: {type: string, format: uuid}}
        scheduled_start: {type: string, format: date-time}
        scheduled_end: {type: string, format: date-time}
    Session:
      allOf:
        - {$ref: '#/components/schemas/SessionInput'}
        - type: object
          properties:
            id: {type: string, format: uuid}
            status: {type: string}
            actual_start: {type: [string, 'null'], format: date-time}
            actual_end: {type: [string, 'null'], format: date-time}
    SessionDossier:
      allOf:
        - {$ref: '#/components/schemas/Session'}
        - type: object
          required: [expected_amount_cents, expected_amount_is_manual, calculate_actual_time, moments, payments, timeline]
          properties:
            expected_amount_cents: {type: integer, minimum: 0}
            expected_amount_is_manual: {type: boolean}
            calculate_actual_time: {type: boolean}
            moments: {type: array, items: {$ref: '#/components/schemas/Moment'}}
            payments: {type: array, items: {$ref: '#/components/schemas/Payment'}}
            timeline: {type: array, items: {$ref: '#/components/schemas/TimelineEntry'}}
    RegisterPaymentInput:
      type: object
      required: [amount_cents, method]
      properties:
        amount_cents: {type: integer, minimum: 1}
        method: {type: string, enum: [cash, pix, debit_card, credit_card, other]}
        note: {type: [string, 'null'], maxLength: 500}
    ExpectedAmountInput:
      type: object
      required: [amount_cents]
      properties: {amount_cents: {type: integer, minimum: 0}}
    ExpectedAmount:
      type: object
      required: [amount_cents]
      properties: {amount_cents: {type: integer, minimum: 0}}
    Payment:
      allOf:
        - {$ref: '#/components/schemas/RegisterPaymentInput'}
        - type: object
          required: [id, session_id, registered_at, registered_by]
          properties:
            id: {type: string, format: uuid}
            session_id: {type: string, format: uuid}
            registered_at: {type: string, format: date-time}
            registered_by: {type: string, format: uuid}
    Moment:
      type: object
      required: [id, space_id, occurred_at, status]
      properties:
        id: {type: string, format: uuid}
        space_id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        status: {type: string}
        replay_path: {type: [string, 'null']}
    TimelineEntry:
      type: object
      required: [kind, occurred_at, data]
      properties:
        kind: {type: string}
        occurred_at: {type: string, format: date-time}
        data: {type: object, additionalProperties: true}
    ButtonPress:
      type: object
      required: [device_id, timestamp]
      properties: {device_id: {type: string}, timestamp: {type: string, format: date-time}}
    ButtonPressResult:
      type: object
      required: [accepted, reason]
      properties:
        accepted: {type: boolean}
        reason: {type: string}
        moment_id: {type: [string, 'null'], format: uuid}
        session_id: {type: [string, 'null'], format: uuid}
    Error:
      type: object
      properties: {code: {type: string}, message: {type: string}}
